[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-motion-extraction"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "opencv-python>=4.5.0",
    "click>=8.0",
]

[project.optional-dependencies]
gui = ["gradio>=4.0"]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.5",
]
dev = [
    "pytest",
    "hypothesis",
    "playwright",
    "pytest-playwright",
    "ruff>=0.4",
]
gpu = [
    "torch>=1.10.0",
    "mmpose>=1.0.0",
    "mmdet>=3.0.0",
    "mmcv>=2.0.0",
    "mmengine>=0.7.0",
]

[project.scripts]
vme = "video_motion_extraction.cli:main"
vme-gui = "video_motion_extraction.gui:main"
vme-web = "video_motion_extraction.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py38"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # 長い行は段階的に解消（既存コードに多数存在）
]

[tool.ruff.lint.per-file-ignores]
# __init__.py は再エクスポートのため未使用import許容
"src/video_motion_extraction/__init__.py" = ["F401"]
